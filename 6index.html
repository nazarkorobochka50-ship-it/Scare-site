<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>❤️ Для тебя</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    height: 100vh;
    font-family: 'Orbitron', Arial, sans-serif;
    overflow: hidden;

    /* 🌌 КОСМОС ФОН */
    background: radial-gradient(circle at 20% 30%, rgba(120,0,255,0.3), transparent 40%),
                radial-gradient(circle at 80% 20%, rgba(0,200,255,0.25), transparent 40%),
                radial-gradient(circle at 50% 80%, rgba(255,0,150,0.2), transparent 50%),
                #000;
}

/* LOGIN */
#login {
    position: absolute;
    width: 100%;
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    z-index: 10;
}

input {
    padding: 10px;
    font-size: 18px;
    border-radius: 10px;
    border: none;
    margin: 10px;
}

button {
    padding: 10px 20px;
    border-radius: 20px;
    border: none;
    background: hotpink;
    color: white;
    cursor: pointer;
    font-size: 18px;
}

/* MAIN */
#main {
    display: none;
}

/* ❤️ HEART */
svg {
    position: absolute;
    top: 40%;
    left: 50%;
    transform: translate(-50%, -50%);
    filter: drop-shadow(0 0 15px #ff2d75);
}

/* 💖 ПРАВИЛЬНАЯ АНИМАЦИЯ РИСОВАНИЯ */
path {
    fill: none;
    stroke: #ff2d75;
    stroke-width: 5;

    stroke-dasharray: 2000;
    stroke-dashoffset: 2000;

    animation: draw 4s ease forwards;
}

@keyframes draw {
    to {
        stroke-dashoffset: 0;
    }
}

/* TEXT */
.text {
    position: absolute;
    top: 65%;
    width: 100%;
    text-align: center;
    font-size: 32px;
    color: #ff99cc;
    text-shadow: 0 0 20px #ff00ff;
}

/* BUTTON */
.love-btn {
    position: absolute;
    bottom: 50px;
    left: 50%;
    transform: translateX(-50%);
    background: linear-gradient(45deg, #ff00cc, #ff3366);
    box-shadow: 0 0 20px #ff00cc;
    transition: 0.3s;
}

.love-btn:hover {
    transform: translateX(-50%) scale(1.1);
}

/* MESSAGE */
#message {
    position: absolute;
    top: 80%;
    width: 100%;
    text-align: center;
    font-size: 28px;
    color: #ff4d6d;
    opacity: 0;
    transition: 0.5s;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="login">
    <h2 style="color:white;">Введи пароль 💖</h2>
    <input type="password" id="pass">
    <button onclick="check()">Войти</button>
</div>

<!-- MAIN -->
<div id="main">

<svg width="320" height="320" viewBox="0 0 512 512">
    <path d="M256 464s-192-112-192-272c0-80 64-144 144-144 48 0 88 24 112 64 24-40 64-64 112-64 80 0 144 64 144 144 0 160-192 272-192 272z"/>
</svg>

<div class="text" id="typing"></div>

<button class="love-btn" onclick="showLove()">Нажми ❤️</button>

<div id="message">Я тебя люблю ❤️❤️‍🩹</div>

</div>

<script>

function check() {
    let p = document.getElementById("pass").value;

    if (p === "котя") {
        document.getElementById("login").style.display = "none";
        document.getElementById("main").style.display = "block";
        setTimeout(typeText, 2500);
    } else {
        alert("Неправильный пароль 😢");
    }
}

/* ✨ текст */
let text = "Оля моя любимая ❤️";
let i = 0;

function typeText() {
    if (i < text.length) {
        document.getElementById("typing").innerHTML += text[i];
        i++;
        setTimeout(typeText, 100);
    }
}

/* ❤️ сообщение */
function showLove() {
    document.getElementById("message").style.opacity = "1";
}

</script>

</body>
</html>
